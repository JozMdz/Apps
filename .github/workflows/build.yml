name: Compilar APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest ya incluye el SDK de Android (ANDROID_HOME).
      - name: Compilar
        run: ./gradlew --no-daemon :app:assembleRelease :lector:assembleRelease

      - name: Pruebas de Estudio en audio
        run: ./gradlew --no-daemon :lector:testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            lector/build/outputs/apk/release/lector-release.apk
            app/build/outputs/apk/release/app-release.apk
