<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#4fc3f7">
<title>Leo y Juego · Control</title>
<style>
  @font-face { font-family: "Andika"; font-weight: 700; src: url("fuentes/andika-latin-700-normal.woff2") format("woff2"); }
  :root { --foco: #ffd600; --tinta: #263238; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Andika", sans-serif; font-weight: 700; color: var(--tinta);
    background: linear-gradient(180deg, #4fc3f7, #b3e5fc 75%, #81c784 75%) fixed;
    display: flex; flex-direction: column; user-select: none; -webkit-user-select: none;
    touch-action: manipulation; overscroll-behavior: none;
  }
  header { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; }
  header button { width: 64px; height: 64px; border-radius: 50%; border: 0; background: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.15); }
  header button img, header button svg { width: 36px; height: 36px; vertical-align: middle; }
  header button.invisible { visibility: hidden; }
  #estado { color: #fff; font-size: 20px; text-shadow: 0 2px 3px rgba(0,0,0,.3); text-align: center; flex: 1; padding: 0 8px; }
  main { flex: 1; overflow-y: auto; padding: 8px 16px 24px; display: flex; flex-direction: column; }
  #botones { margin: auto 0; }
  html, body { height: 100%; overflow: hidden; }
  #botones { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 16px; }
  #botones.lista { grid-template-columns: 1fr; grid-gap: 12px; }
  #botones.album { grid-template-columns: repeat(4, 1fr); grid-gap: 10px; }
  #botones.c1 { grid-template-columns: 1fr; }
  #botones.c3 { grid-template-columns: repeat(3, 1fr); grid-gap: 12px; }
  #botones.c4 { grid-template-columns: repeat(4, 1fr); grid-gap: 10px; }
  #botones.c6 { grid-template-columns: repeat(6, minmax(0, 1fr)); grid-gap: 6px; }
  #botones.c6 button { min-width: 0; }
  #botones.c6 button.ancho { grid-column: span 3; aspect-ratio: auto; min-height: 52px; }
  /* «Mi mundo»: el mundo de 10 x 6 y abajo los bloques para elegir */
  #botones.mundo { grid-template-columns: repeat(10, 1fr); grid-gap: 0; background: linear-gradient(#63acf3, #aad6fa); box-shadow: 0 0 0 4px #1e1e1e; }
  #botones.mundo button.celda { aspect-ratio: 1 / 1; min-height: 0; padding: 0; border-radius: 0; background: transparent center / 100% 100%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); }
  #botones.mundo button.celda.foco { box-shadow: inset 0 0 0 3px #fff; }
  #botones.mundo button.ranura { grid-column: span 2; aspect-ratio: 1 / 1; min-height: 0; margin: 6px 4px 0; padding: 6px; border-radius: 4px; background: #8b8b8b; position: relative; }
  #botones.mundo button.ranura img { width: 80%; height: 80%; }
  #botones.mundo button.ranura b { position: absolute; right: 4px; bottom: 0; font-size: 18px; color: #fff; text-shadow: 2px 2px 0 #1e1e1e; }
  #botones.mundo button.ranura.elegida { background: #fff; box-shadow: 0 0 0 4px #ffd600; }
  #botones.mundo button.ranura.vacia img { opacity: .3; }
  #botones.c2g button { min-height: 38vh; font-size: 64px; background: #ffd600; }
  #botones button {
    border: 0; border-radius: 26px; background: #fff; font-family: inherit; font-weight: 700; color: var(--tinta);
    box-shadow: 0 6px 0 rgba(0,0,0,.15); display: flex; align-items: center; justify-content: center;
    min-height: 60px; font-size: 24px; padding: 8px 16px; transition: transform .1s; flex-wrap: wrap;
  }
  #botones button:active { transform: scale(.94); }
  #botones button.grande { aspect-ratio: 1 / 1; min-height: 120px; font-size: 60px; padding: 12px; }
  #botones button.grande.largo { font-size: 30px; }
  #botones button.grande.pad { font-size: 28px; }
  #botones button.grande img { width: 82%; height: 82%; }
  #botones button.grande.varios img { width: 26%; height: auto; margin: 2%; }
  #botones button.grande.escena { flex-direction: column; }
  #botones button.grande.escena span { display: flex; justify-content: center; width: 100%; }
  #botones button.grande.escena img { width: 28%; height: auto; margin: 1%; }
  #botones button .circulo { width: 76%; height: 76%; border-radius: 50%; border: 4px solid rgba(0,0,0,.18); display: block; }
  #botones.album button, #botones.c4 button, #botones.c6 button { min-height: 0; padding: 6px; border-radius: 14px; }
  #botones.c4 button.grande { font-size: 40px; }
  #botones.c6 button { font-size: 24px; aspect-ratio: 1 / 1; padding: 0; }
  #botones.c3 button { min-height: 76px; font-size: 34px; }
  #botones.c3 button.grande, #botones.c3 button.grande.largo { min-height: 0; font-size: 30px; }
  #botones.c1 button { min-height: 46vh; font-size: 56px; background: #ffd600; }
  #botones.album button img { width: 100%; height: 100%; }
  #botones button.tarjeta { justify-content: flex-start; font-size: 28px; min-height: 64px; }
  #botones button.tarjeta img { width: 50px; height: 50px; margin-right: 18px; }
  #botones button.tarjeta .abc { min-width: 50px; margin-right: 18px; text-align: center; color: #c62828; font-size: 30px; }
  #botones button .icono { width: 30px; height: 30px; margin-right: 10px; }
  #botones button.foco { box-shadow: 0 0 0 6px var(--foco), 0 6px 0 rgba(0,0,0,.15); }
  #botones button.bien { background: #c8e6c9 !important; box-shadow: 0 0 0 6px #43a047; }
  #botones button.mal { background: #ffcdd2 !important; opacity: .6; animation: tiembla .4s; }
  #botones button.usada { visibility: hidden; }
  #botones button.guia { box-shadow: 0 0 0 8px #fff, 0 0 30px 10px #fff; }
  #botones button.bloqueada img { filter: brightness(0); opacity: .2; }
  #botones button.escuchar { grid-column: 1 / -1; background: #ffe0b2; font-size: 30px; }
  #botones button.escuchar img { width: 44px; height: 44px; margin-right: 12px; }
  #titulo { color: #fff; font-size: 30px; text-align: center; margin: 0 0 12px; flex-shrink: 0; text-shadow: 0 3px 0 #0277bd; min-height: 10px; }
  #aviso { color: #fff; font-size: 26px; text-align: center; text-shadow: 0 2px 4px rgba(0,0,0,.35); line-height: 1.4; }
  @keyframes tiembla { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
</style>
</head>
<body>
<header>
  <button id="atras" class="invisible" aria-label="Atrás"><svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z" fill="#263238"/></svg></button>
  <div id="estado">Conectando con la TV…</div>
  <button id="repetir" class="invisible" aria-label="Escuchar otra vez"><img src="img/_altavoz.svg" alt=""></button>
</header>
<main>
  <h1 id="titulo"></h1>
  <div id="botones"></div>
  <p id="aviso"></p>
</main>
<script src="js/peerjs.min.js"></script>
<script src="js/control.js"></script>
</body>
</html>
