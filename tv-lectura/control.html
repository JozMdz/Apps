<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#4fc3f7">
<title>Leo y Juego · Control</title>
<style>
  @font-face { font-family: "Andika"; font-weight: 700; src: url("fuentes/andika-latin-700-normal.woff2") format("woff2"); }
  :root { --tinta: #263238; --ok: #ffd600; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "Andika", sans-serif; font-weight: 700; color: var(--tinta);
    background: linear-gradient(180deg, #4fc3f7, #b3e5fc 75%, #81c784 75%) fixed;
    display: flex; flex-direction: column; user-select: none; -webkit-user-select: none;
    touch-action: none; overscroll-behavior: none;
  }
  button { font-family: inherit; font-weight: 700; color: var(--tinta); border: 0; }
  header { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; }
  .redondo { width: 64px; height: 64px; border-radius: 50%; background: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.15); }
  .redondo img, .redondo svg { width: 34px; height: 34px; vertical-align: middle; }
  .redondo.apagado { opacity: .35; }
  #centro { flex: 1; text-align: center; color: #fff; text-shadow: 0 2px 3px rgba(0,0,0,.3); padding: 0 8px; }
  #estado { font-size: 15px; opacity: .9; }
  #titulo { font-size: 24px; line-height: 1.15; }

  #modos { flex-shrink: 0; display: flex; margin: 8px 16px; background: rgba(255,255,255,.45); border-radius: 40px; padding: 5px; }
  #modos button { flex: 1; height: 48px; border-radius: 30px; background: transparent; font-size: 20px; }
  #modos button.activo { background: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.12); }

  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px 16px 24px; min-height: 0; }

  /* Cruceta */
  #cruceta { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    width: min(92vw, 60vh); aspect-ratio: 1 / 1; gap: 10px; }
  #cruceta button { background: #fff; border-radius: 26px; box-shadow: 0 7px 0 rgba(0,0,0,.18); display: flex; align-items: center; justify-content: center; }
  #cruceta button svg { width: 52%; height: 52%; }
  #cruceta .ok { border-radius: 50%; background: var(--ok); box-shadow: 0 7px 0 #f9a825; font-size: 9vmin; }
  #cruceta .vacio { visibility: hidden; }
  #cruceta button.presionado, .grande.presionado { transform: scale(.92); filter: brightness(.92); }

  /* Puntero */
  #panel { display: none; flex-direction: column; width: 100%; height: 100%; }
  #tactil { flex: 1; border-radius: 30px; background: rgba(255,255,255,.55); border: 4px dashed #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    color: #37474f; font-size: 20px; padding: 20px; position: relative; overflow: hidden; }
  #tactil svg { width: 70px; height: 70px; margin-bottom: 10px; opacity: .7; }
  #tactil.tocando { background: rgba(255,255,255,.75); }
  #dedo { position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; background: rgba(255,214,0,.6); display: none; pointer-events: none; }
  .grande { margin-top: 14px; height: 90px; border-radius: 45px; background: var(--ok); box-shadow: 0 7px 0 #f9a825; font-size: 34px; }

  body.puntero #cruceta { display: none; }
  body.puntero #panel { display: flex; }

  #aviso { position: fixed; left: 16px; right: 16px; bottom: 20px; color: #fff; font-size: 20px; text-align: center; text-shadow: 0 2px 4px rgba(0,0,0,.4); }
</style>
</head>
<body>
<header>
  <button id="atras" class="redondo" aria-label="Atrás"><svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z" fill="#263238"/></svg></button>
  <div id="centro"><div id="estado">Conectando con la TV…</div><div id="titulo"></div></div>
  <button id="repetir" class="redondo apagado" aria-label="Escuchar otra vez"><img src="img/_altavoz.svg" alt=""></button>
</header>
<div id="modos">
  <button id="modo-flechas" class="activo">✚ Flechas</button>
  <button id="modo-puntero">☝ Puntero</button>
</div>
<main>
  <div id="cruceta">
    <span class="vacio"></span>
    <button data-k="38" aria-label="Arriba"><svg viewBox="0 0 24 24"><path d="M12 5 L21 17 L3 17 Z" fill="#263238"/></svg></button>
    <span class="vacio"></span>
    <button data-k="37" aria-label="Izquierda"><svg viewBox="0 0 24 24"><path d="M5 12 L17 3 L17 21 Z" fill="#263238"/></svg></button>
    <button data-k="13" class="ok">OK</button>
    <button data-k="39" aria-label="Derecha"><svg viewBox="0 0 24 24"><path d="M19 12 L7 3 L7 21 Z" fill="#263238"/></svg></button>
    <span class="vacio"></span>
    <button data-k="40" aria-label="Abajo"><svg viewBox="0 0 24 24"><path d="M12 19 L21 7 L3 7 Z" fill="#263238"/></svg></button>
    <span class="vacio"></span>
  </div>
  <div id="panel">
    <div id="tactil">
      <svg viewBox="0 0 32 32"><path d="M5 3 L5 26 L11 20 L15 29 L19 27 L15 18 L24 18 Z" fill="#fff" stroke="#263238" stroke-width="2"/></svg>
      Mueve el dedo aquí para mover la flecha de la tele.<br>Toca una vez para elegir.
      <div id="dedo"></div>
    </div>
    <button id="ok-puntero" class="grande">OK</button>
  </div>
</main>
<p id="aviso"></p>
<script src="js/peerjs.min.js"></script>
<script src="js/control.js"></script>
</body>
</html>
